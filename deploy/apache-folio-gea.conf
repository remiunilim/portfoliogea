# Modèle de configuration Apache pour Folio GEA (reverse proxy vers Next.js).
# À adapter puis copier dans /etc/apache2/sites-available/ sur le serveur de la DSI.
#
# Modules Apache nécessaires :
#   sudo a2enmod proxy proxy_http ssl headers rewrite
#
# Remplacer :
#   folio-gea.universite.fr   -> le nom de domaine réel
#   127.0.0.1:3000             -> l'adresse où écoute Next.js (voir deploy/folio-gea.service)

<VirtualHost *:80>
    ServerName folio-gea.universite.fr

    # Redirection vers HTTPS (laisser seulement si un certificat est en place).
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName folio-gea.universite.fr

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/folio-gea.universite.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/folio-gea.universite.fr/privkey.pem

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto "https"

    # Traces PDF et export du portfolio : jusqu'à 11 Mo (voir serverActions.bodySizeLimit dans next.config.ts).
    LimitRequestBody 12582912

    ErrorLog  ${APACHE_LOG_DIR}/folio-gea-error.log
    CustomLog ${APACHE_LOG_DIR}/folio-gea-access.log combined
</VirtualHost>
