<title>Folio GEA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : barre d'application + espace de travail (onglets par compétence, panneau latéral référentiel/évaluation) */
:root {
  --bg: #f3f6f8;
  --surface: #ffffff;
  --sunk: #eef2f5;
  --fg: #16212a;
  --muted: #5a6975;
  --line: #dbe2e7;
  --accent: #1f5f8b;
  --accent-fg: #ffffff;
  --accent-soft: #e3eef6;
  --c1: #0b7fb5; --c1-soft: #e4f3fa;
  --c2: #c47d07; --c2-soft: #fbf2e0;
  --c3: #138a5e; --c3-soft: #e2f4ec;
  --c4: #6c4bc4; --c4-soft: #efeafb;
  --c5: #c23d63; --c5-soft: #fbe8ee;
  --ok: #157a4f; --ok-soft: #e1f3ea;
  --warn: #9a6200; --warn-soft: #fcf1dc;
  --bad: #b3261e; --bad-soft: #fbe6e4;
  --info: #155f8f; --info-soft: #e1eef8;
  --new: #d0284f;
  --font-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181e; --surface: #18222a; --sunk: #141d24; --fg: #e4ebf0; --muted: #96a6b2; --line: #2a3742;
    --accent: #6fb2e0; --accent-fg: #0d1a24; --accent-soft: #1b3346;
    --c1: #5cc0ec; --c1-soft: #16303d; --c2: #f0b54a; --c2-soft: #3a2d14; --c3: #4fcf98; --c3-soft: #15352a;
    --c4: #a98ff0; --c4-soft: #2a2343; --c5: #f07a9b; --c5-soft: #3d1e28;
    --ok: #5fd39c; --ok-soft: #173a2a; --warn: #f2bd5a; --warn-soft: #3b2e12; --bad: #f2867d; --bad-soft: #3d1c19;
    --info: #79b9e8; --info-soft: #18324a; --new: #ff6b8b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181e; --surface: #18222a; --sunk: #141d24; --fg: #e4ebf0; --muted: #96a6b2; --line: #2a3742;
  --accent: #6fb2e0; --accent-fg: #0d1a24; --accent-soft: #1b3346;
  --c1: #5cc0ec; --c1-soft: #16303d; --c2: #f0b54a; --c2-soft: #3a2d14; --c3: #4fcf98; --c3-soft: #15352a;
  --c4: #a98ff0; --c4-soft: #2a2343; --c5: #f07a9b; --c5-soft: #3d1e28;
  --ok: #5fd39c; --ok-soft: #173a2a; --warn: #f2bd5a; --warn-soft: #3b2e12; --bad: #f2867d; --bad-soft: #3d1c19;
  --info: #79b9e8; --info-soft: #18324a; --new: #ff6b8b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }

.appbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.appbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.brand strong { display: block; font-size: 15px; }
.brand span { display: block; font-size: 12px; color: var(--muted); }
.account { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.account select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); max-width: 260px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 12px; font-size: 14px; }
.btn:hover { background: var(--sunk); }
.btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 500; }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-primary:disabled { opacity: .55; cursor: default; filter: none; }
.btn-link { border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; }
.btn-link:hover { text-decoration: underline; }
.btn-danger { color: var(--bad); }

.demo-note { background: var(--warn-soft); color: var(--warn); font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--line); }
main { padding-block: 22px 48px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
.page-head h1 { font-size: 26px; font-weight: 600; }
.sub { color: var(--muted); font-size: 14px; }
.back { display: inline-block; margin-bottom: 8px; }

.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; font-size: 14px; font-weight: 500; }
.seg button:hover:not(:disabled) { background: var(--accent-soft); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.seg button:disabled { color: var(--muted); opacity: .5; cursor: not-allowed; }
.seg small { font-weight: 400; opacity: .8; font-size: 11px; }

/* Les onglets passent à la ligne plutôt que de défiler : pas de barre de défilement. */
.tabs { display: flex; flex-wrap: wrap; column-gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.tab { border: 0; background: none; padding: 10px 10px; border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 13px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.state { font-size: 12px; }
.tag-new { background: var(--new); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; }

.grid-main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 22px; align-items: start; }
@media (max-width: 900px) { .grid-main { grid-template-columns: minmax(0, 1fr); } }
.stack { display: grid; gap: 18px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.card h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card h2 small { font-weight: 400; font-size: 12px; color: var(--muted); }
.comp-head { border-radius: 12px; padding: 18px; border: 1px solid var(--line); }
.eyebrow { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; }
.comp-head h2 { font-size: 21px; font-weight: 600; margin: 4px 0 4px; }

label.field { display: grid; gap: 4px; font-size: 14px; font-weight: 500; }
.input, textarea.input { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; background: var(--surface); font-weight: 400; font-size: 14px; }
textarea.input { line-height: 1.6; resize: vertical; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.form { display: grid; gap: 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .two { grid-template-columns: 1fr; } }
.count { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.msg-ok { color: var(--ok); font-size: 13px; }
.msg-err { color: var(--bad); font-size: 13px; }
.msg-warn { color: var(--warn); font-size: 12px; }
.drop { border: 1.5px dashed var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 14px; }
.empty { color: var(--muted); font-size: 14px; }
.prose { white-space: pre-wrap; font-size: 14.5px; line-height: 1.65; margin: 0; }

.trace { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.trace-top { display: flex; gap: 12px; align-items: flex-start; }
.pdf { width: 36px; height: 42px; flex: none; border-radius: 4px; background: var(--bad-soft); color: var(--bad); font: 600 10px var(--font-data); display: grid; place-items: center; }
.trace-title { font-weight: 600; }
.meta { font-family: var(--font-data); font-size: 11.5px; color: var(--muted); }
ul.plain { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
ul.ac { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
details summary { cursor: pointer; color: var(--accent); font-size: 13px; }

.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.ev-non_evalue { background: var(--sunk); color: var(--muted); border-color: var(--line); }
.ev-insuffisant { background: var(--bad-soft); color: var(--bad); }
.ev-en_cours { background: var(--warn-soft); color: var(--warn); }
.ev-acquis { background: var(--ok-soft); color: var(--ok); }
.ev-depasse { background: var(--info-soft); color: var(--info); }
.radios { display: grid; gap: 6px; font-size: 14px; }
.radios label { display: flex; gap: 8px; align-items: center; }
.radios input { accent-color: var(--accent); }
.notice { border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.notice.info { background: var(--info-soft); color: var(--info); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.guide ol { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 14px; }
.guide span { display: block; color: var(--muted); }

.feed { list-style: none; padding: 0; margin: 0; display: grid; gap: 11px; font-size: 13.5px; }
.feed li { display: flex; gap: 10px; }
.feed .dot { margin-top: 7px; }
.feed .when { font-size: 12px; color: var(--muted); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.kpi b { display: block; font: 600 24px var(--font-data); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.bell { position: relative; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--fg); }
.bell:hover { background: var(--accent-soft); }
.bell-count { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--new); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.notif-list { list-style: none; margin: 0; padding: 0; overflow: hidden; }
.notif-list li + li { border-top: 1px solid var(--line); }
.notif { width: 100%; display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 0; background: none; padding: 12px 16px; font-size: 14px; }
.notif:hover { background: var(--accent-soft); }
.notif.unread { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); }
.notif .dot { margin-top: 7px; }
.notif .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
.choix { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-size: 14px; }
.choix:hover, .choix:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choix input { margin-top: 3px; accent-color: var(--accent); }
.kpis-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 900px) { .kpis-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi.warn { background: var(--warn-soft); border-color: transparent; }
.kpi.warn b { color: var(--warn); }
.seg-chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.seg-chip:hover { background: var(--accent-soft); }
.seg-chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
table.assign { width: 100%; min-width: 460px; border-collapse: collapse; font-size: 14px; }
table.assign td { padding: 10px 16px; border-top: 1px solid var(--line); }
table.assign select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.kpi.alert { background: var(--bad-soft); border-color: transparent; }
.kpi.alert b { color: var(--new); }
.table-wrap { overflow-x: auto; }
table.promo { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 14px; }
table.promo th { text-align: center; font-weight: 600; padding: 12px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 13px; }
table.promo th:first-child, table.promo td:first-child { text-align: left; padding-left: 16px; }
table.promo td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.promo tr:last-child td { border-bottom: 0; }
.cell { position: relative; width: 100%; max-width: 150px; min-height: 60px; margin: 0 auto; display: grid; place-items: center; gap: 3px; border-radius: 9px; border: 1px dashed var(--line); background: none; padding: 6px; font-size: 12px; color: var(--muted); }
.cell:hover { box-shadow: 0 0 0 2px var(--accent-soft); }
.cell.partiel { border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); background: var(--warn-soft); }
.cell.complet { border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); background: var(--ok-soft); }
/* Dans les cellules étroites, le niveau et la note peuvent passer à la ligne au lieu de déborder. */
.cell .pill { white-space: normal; text-align: center; line-height: 1.3; max-width: 100%; overflow-wrap: anywhere; }
.cell > span { max-width: 100%; }
.theme-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; }
.theme-btn:hover { background: var(--accent-soft); }
.cell .new { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--new); }
.cell .flag { font-size: 10.5px; font-weight: 600; color: var(--warn); }
.name-btn { border: 0; background: none; padding: 0; font-weight: 600; text-align: left; }
.name-btn:hover { color: var(--accent); text-decoration: underline; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); }

.full-year { display: grid; gap: 14px; }
.full-year > h2 { font-size: 18px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.full-item header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.full-item h3 { font-size: 16px; }
.comment { background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }
@media (prefers-reduced-motion: no-preference) { .card, .comp-head { transition: border-color .15s; } }
</style>

<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ---------- Référentiel BUT GEA – parcours GEMA (2022) ----------
const COMPETENCES = [
  { code: "C1", court: "Analyser", intitule: "Analyser les processus de l'organisation dans son environnement", tronc: true,
    niveaux: { 1: ["Identifier les processus de l'organisation", ["Identifier les différents types d'enjeux", "Qualifier les différents types d'organisations", "Identifier les relations des acteurs au sein d'un processus"]],
               2: ["Évaluer les processus de l'organisation", ["Analyser les différents types d'enjeux", "Analyser les dimensions identitaires (juridiques, managériales…) de l'organisation", "Évaluer le niveau de performance des processus"]],
               3: ["Conseiller pour l'amélioration des processus de l'organisation", ["Intégrer l'impact des enjeux sur l'organisation", "Conseiller un type d'organisation", "Proposer des améliorations des processus"]] } },
  { code: "C2", court: "Décider", intitule: "Aider à la prise de décision", tronc: true,
    niveaux: { 1: ["Identifier les éléments d'aide à la prise de décision", ["Identifier les composantes du système d'information de gestion", "Rechercher, collecter et traiter les données brutes afin de produire et de diffuser une information structurée", "Identifier les contraintes qui s'imposent à l'organisation", "Identifier les risques"]],
               2: ["Évaluer les éléments d'aide à la prise de décision", ["Analyser les enjeux du système d'information et leur impact sur le fonctionnement de l'organisation", "Exploiter un ERP/PGI et ses fonctionnalités de base", "Traiter les données pertinentes pour répondre à une problématique", "Analyser les contraintes et leur impact sur la performance de l'organisation", "Évaluer les risques"]],
               3: ["Concourir à la prise de décision", ["Collaborer au processus d'amélioration continue du système d'information", "Exploiter les données pour accompagner la prise de décision", "Participer à la prise de décision en fonction des contraintes identifiées", "Élaborer des mesures préventives de minimisation des risques"]] } },
  { code: "C3", court: "Piloter", intitule: "Piloter les relations avec les parties prenantes de l'organisation", tronc: true,
    niveaux: { 1: ["Identifier les relations entre les parties prenantes", ["Identifier ses qualités individuelles", "Identifier les relations inter-personnelles et collectives", "Travailler en équipe avec méthodes", "Utiliser de façon pertinente les techniques de communication"]],
               2: ["Coordonner les relations entre les parties prenantes", ["Mobiliser ses qualités individuelles au service de l'intelligence collective", "Analyser les relations inter-personnelles et collectives dans la stratégie de l'organisation", "Utiliser les outils d'organisation et méthodes dédiés au travail collaboratif", "Combiner les méthodes de communication en lien avec la stratégie"]],
               3: ["Améliorer les relations entre les parties prenantes", ["Animer une équipe", "Mener un projet collaboratif", "Participer à l'amélioration de la politique de communication en lien avec la stratégie"]] } },
  { code: "C4", court: "Entreprendre", intitule: "Concevoir la stratégie de création de valeur", tronc: false,
    niveaux: { 2: ["Modéliser la proposition de valeur", ["S'adapter aux évolutions induites par le contexte d'incertitude", "Évaluer le potentiel d'un marché à partir d'une collecte d'informations pertinentes", "Modéliser les composantes d'un business model d'une entité existante", "Apprécier la cohérence d'un business model et de son business plan"]],
               3: ["Sécuriser la proposition de valeur", ["Tester la viabilité financière d'un business model", "Apprécier les risques financiers, fiscaux et juridiques de l'entité ou de l'entrepreneur", "Préconiser les mesures de protection contre les risques", "Persuader une partie prenante de la viabilité du business plan", "Confronter son projet à son expérience de terrain"]] } },
  { code: "C5", court: "Développer", intitule: "Assurer la gestion et le développement de la chaîne de valeur", tronc: false,
    niveaux: { 2: ["Développer la chaîne de valeur", ["Promouvoir un projet, un événement ou une organisation par des actions de communication adaptées", "Identifier la variété et la complexité des processus de production et de supply chain", "Utiliser les techniques de négociation avec les partenaires commerciaux", "Évaluer les axes d'une démarche de marketing opérationnel, y compris digitale", "Évaluer le risque de trésorerie", "Contribuer à la gestion opérationnelle des ressources humaines"]],
               3: ["Optimiser la chaîne de valeur", ["Concevoir une stratégie de communication en utilisant les outils adaptés, y compris digitaux", "Mettre en œuvre des processus de production et de supply chain adaptés à la situation de l'entité", "Concevoir une démarche de marketing opérationnel adaptée à l'entité", "Prévenir les risques de défaillance avec les outils adaptés", "Déterminer les axes principaux d'une politique de ressources humaines dans l'entité"]] } },
];
// Niveau de développement : tronc commun 1→2→3 ; GEMA commence en BUT2 (niveau 1) puis BUT3 (niveau 2).
const niveauNum = (c, a) => c.tronc ? a : a - 1;
// Compétences C4 et C5 propres à chaque parcours (référentiels nationaux 2022) ; C1 à C3 = tronc commun.
const COMPETENCES_PARCOURS = {
  GEMA: { intitule: "Gestion, entrepreneuriat et management d'activités", comps: COMPETENCES.filter((c) => !c.tronc) },
  GPRH: { intitule: "Gestion et pilotage des ressources humaines", comps: [

const estActif = (u) => !!u && u.actif !== false;
const prefDe = (u) => u.pref || (u.role === "etudiant" ? "immediat" : "aucun");
// Notification dans l'outil + courriel en file d'attente selon la préférence du destinataire.
function notifierAvecCourriel(n) {
  S.notifs.push({ id: "n" + seq++, lue: false, at: now(), ...n });
  const d = user(n.dest);
  if (d && estActif(d) && d.email && prefDe(d) !== "aucun") S.courriels.push({ dest: d.id, adresse: d.email, sujet: n.titre, mode: prefDe(d), statut: "en_attente", at: now() });
}
// Le référent est prévenu des dépôts de l'étudiant ; tant qu'il n'a pas lu, on met à jour la même notification.
function prevenirReferent(etuId, annee, comp, quoi) {
  const ref = referentDe(etuId), e = user(etuId);
  if (!ref) return;
  const c = comp ? compParCode(comp, e.parcours) : null;
  const titre = c ? `${e.prenom} ${e.nom} · ${c.code} ${c.court} (BUT${annee}) mis à jour` : `${e.prenom} ${e.nom} a mis à jour sa présentation`;
  const cle = `${etuId}|${annee}|${comp}`;
  const enCours = S.notifs.find((n) => n.dest === ref && n.cle === cle && !n.lue);
  if (enCours) { enCours.nb = (enCours.nb || 1) + 1; enCours.titre = titre; enCours.detail = `${enCours.nb} modifications depuis votre dernière lecture · dernière : ${quoi}`; enCours.at = now(); return; }
  notifierAvecCourriel({ dest: ref, cle, titre, detail: quoi, annee: annee || e.annee, onglet: comp || "presentation", etu: etuId });
}
const nonPublie = (ev) => !!ev && ev.niveau !== "non_evalue" && (!ev.pub || ev.pub.niveau !== ev.niveau || ev.pub.com !== ev.com || ev.pub.note !== ev.note);
const rdvNonPublie = (r) => !!r && r.note !== null && (!r.pub || r.pub.note !== r.note || r.pub.com !== r.com);
const rdvDe = (etu, a, n) => S.rdv[`${etu}|${a}|${n}`];
const peutModifier = (etu, a) => { const u = user(ui.user); return u.role === "etudiant" && u.id === etu && (a === undefined || a <= u.annee); };

// ---------- Thème clair / sombre ----------
// Clair par défaut ; le choix de l'utilisateur est mémorisé dans son navigateur.
const CLE_THEME = "folio-gea-theme";
function themeActuel() { return document.documentElement.dataset.theme === "dark" ? "dark" : "light"; }
function appliquerTheme(theme) { document.documentElement.dataset.theme = theme; }
try { appliquerTheme(localStorage.getItem(CLE_THEME) === "dark" ? "dark" : "light"); } catch (e) { appliquerTheme("light"); }

// ---------- Rendu ----------
function render() {
  const u = user(ui.user);
  const opts = (role) => USERS.filter((x) => estActif(x) && (role === "e" ? x.role === "etudiant" : x.role !== "etudiant"))
    .map((x) => `<option value="${x.id}" ${x.id === ui.user ? "selected" : ""}>${esc(x.prenom + " " + x.nom)}${x.annee ? ` — BUT${x.annee}` : x.role === "admin" ? " — admin" : ""}</option>`).join("");
  let corps;
  const mesNotifs = S.notifs.filter((n) => n.dest === u.id);
  const nonLues = mesNotifs.filter((n) => !n.lue).length;
  if (ui.vue === "notifications") corps = vueNotifications(mesNotifs);
  else if (ui.vue === "compte") corps = vueCompte(u);
  else if (u.role === "admin" && ui.vue === "fiche") corps = vueFiche();
  else if (u.role === "admin" && ui.vue === "passage") corps = vuePassage();
  else if (u.role === "admin" && ui.vue === "affectations") corps = vueAffectations();
  else if (estEns(u) && (!ui.etu || !suit(u, ui.etu))) { ui.etu = null; corps = vueTableau(u); }
  else corps = vuePortfolio(u);
  $("#app").innerHTML = `
    <header class="appbar"><div class="wrap">
      <div class="brand"><div class="brand-mark">GEA</div><div><strong>Folio GEA</strong><span>Portfolio de compétences · PAÉ</span></div></div>
      ${estEns(u) ? `<button class="btn" data-act="tableau">${u.role === "admin" ? "Suivi des promotions" : "Mes étudiants"}</button>` : `<button class="btn" data-act="portfolio">Mon portfolio</button>`}
      ${u.role === "admin" ? `<button class="btn" data-act="affectations">Étudiants et affectations</button>` : ""}
      <button class="bell" data-act="notifications" aria-label="Notifications${nonLues ? ` : ${nonLues} non lue${nonLues > 1 ? "s" : ""}` : ""}" title="Notifications">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9" stroke-linejoin="round"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" stroke-linecap="round"/></svg>
        ${nonLues ? `<span class="bell-count">${nonLues > 9 ? "9+" : nonLues}</span>` : ""}
      </button>
      <button class="btn" data-act="compte" title="Mon compte et préférences de notification">${esc(u.prenom + " " + u.nom)}</button>
      <button class="theme-btn" data-act="theme" aria-label="${themeActuel() === "dark" ? "Passer au thème clair" : "Passer au thème sombre"}" title="${themeActuel() === "dark" ? "Thème clair" : "Thème sombre"}">
        ${themeActuel() === "dark"
          ? `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/></svg>`
          : `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" stroke-linejoin="round"/></svg>`}
      </button>
      <div class="account"><label for="compte">Compte de démonstration</label>
        <select id="compte"><optgroup label="Enseignants">${opts("t")}</optgroup><optgroup label="Étudiants">${opts("e")}</optgroup></select>
        <button class="btn" data-act="reset" title="Remettre le jeu de démonstration à zéro">Réinitialiser</button>
      </div>
    </div></header>
    <div class="demo-note"><div class="wrap">Maquette de démonstration : comptes et données fictifs, enregistrés uniquement dans ce navigateur. Les PDF ne sont pas conservés ici (seulement leur nom) ; la version locale de l'application les stocke et produit l'export PDF.</div></div>
    <main class="wrap">${corps}</main>`;
  // Les notifications affichées sont marquées lues ; la mise en évidence reste jusqu'au prochain affichage.
  if (ui.vue === "notifications" && nonLues) { mesNotifs.forEach((n) => (n.lue = true)); save(); }
}

function vueNotifications(notifs) {
  const liste = [...notifs].sort((a, b) => b.at.localeCompare(a.at));
  return `<div class="page-head"><div><h1>Notifications</h1><div class="sub">L'envoi par courriel sera branché avec la messagerie de l'université, à l'adresse importée.</div></div></div>
    ${liste.length ? `<ul class="card notif-list">${liste.map((n) => `<li><button class="notif ${n.lue ? "" : "unread"}" data-ouvrir-notif="${n.id}">
      <span class="dot" style="background:${n.lue ? "transparent" : "var(--new)"}"></span>
      <span style="flex:1;min-width:0"><strong>${esc(n.titre)}</strong><span class="sub" style="display:block">${esc(n.detail)}</span></span>
      <span class="when">${rel(n.at)}</span></button></li>`).join("")}</ul>`
      : `<div class="card empty" style="text-align:center;padding:32px">Vous serez prévenu·e ici dès qu'une évaluation de votre portfolio sera publiée.</div>`}`;
}

function vuePortfolio(u) {
  const etu = user(ui.etu);
  const max = etu.annee;
  if (ui.annee > max) ui.annee = max;
  const comps = compsAnnee(ui.annee, etu.parcours);
  if (!["presentation", "complet", "suivi"].includes(ui.onglet) && !comps.some((c) => c.code === ui.onglet)) ui.onglet = "presentation";
  const ens = estEns(u);
  const nouveau = (c) => { const m = derniereModif(etu.id, ui.annee, c); return ens && m && (!ui.vuAvant || m > ui.vuAvant); };
  const ongletsComp = comps.map((c) => {
    const e = etat(etu.id, ui.annee, c.code);
    return `<button class="tab" role="tab" aria-selected="${ui.onglet === c.code}" data-onglet="${c.code}">
      <span class="dot" style="background:${cvar(c.code)}"></span>${c.code} · ${c.court}
      <span class="state" style="color:${e === "complet" ? "var(--ok)" : e === "partiel" ? "var(--warn)" : "var(--line)"}" title="${e === "complet" ? "Argumentaire et trace déposés" : e === "partiel" ? "Dépôt incomplet" : "Rien déposé"}">${e === "complet" ? "●" : e === "partiel" ? "◐" : "○"}</span>
      ${nouveau(c.code) ? `<span class="tag-new">Nouveau</span>` : ""}</button>`;
  }).join("");
  const comp = comps.find((c) => c.code === ui.onglet);
  let contenu;
  if (comp) contenu = vueCompetence(u, etu, comp);
  else if (ui.onglet === "complet") contenu = vueComplete(u, etu);
  else if (ui.onglet === "suivi") contenu = vueSuivi(u, etu);
  else contenu = vuePresentation(u, etu);
  return `
    ${ens ? `<button class="btn-link back" data-act="tableau">← Tableau de la promotion BUT${max}</button>` : ""}
    <div class="page-head">
      <div><h1>${u.id === etu.id ? "Mon portfolio" : `Portfolio de ${esc(etu.prenom + " " + etu.nom)}`}</h1>
        <div class="sub">BUT${max} GEA · parcours ${parcoursDe(etu.parcours)} (${COMPETENCES_PARCOURS[parcoursDe(etu.parcours)].intitule}) · ${etu.groupe} · référent·e : ${referentDe(etu.id) ? esc(nom(referentDe(etu.id))) : "non affecté"}</div></div>
      <div class="seg" role="group" aria-label="Année de BUT">${[1, 2, 3].map((a) => `<button data-annee="${a}" aria-pressed="${a === ui.annee}" ${a > max ? "disabled title=\"Année pas encore commencée\"" : ""}>BUT${a}${a < max ? ` <small>historique</small>` : ""}</button>`).join("")}</div>
    </div>
    ${peutModifier(etu.id) && ui.annee < max && comp ? `<div class="notice info" style="margin-bottom:14px">Vous complétez l'historique de votre BUT${ui.annee}. Ces dépôts restent rattachés au niveau de compétence de BUT${ui.annee}.</div>` : ""}
    <nav class="tabs" role="tablist" aria-label="Onglets du portfolio">
      <button class="tab" role="tab" aria-selected="${ui.onglet === "presentation"}" data-onglet="presentation">Présentation</button>
      ${ongletsComp}
      <button class="tab" role="tab" aria-selected="${ui.onglet === "suivi"}" data-onglet="suivi">Suivi et notes</button>
      <button class="tab" role="tab" aria-selected="${ui.onglet === "complet"}" data-onglet="complet">Portfolio complet</button>
    </nav>
    ${contenu}`;
}

function vuePresentation(u, etu) {
  const p = S.pres[etu.id];
  const modif = peutModifier(etu.id);
  const f = ui.flash.pres;
  const corps = modif ? `
    <form class="form" data-form="pres">
      <label class="field">Qui suis-je ? <textarea id="pres-texte" name="texte" rows="7" class="input" placeholder="Votre parcours, vos expériences (stages, alternance, engagements), vos centres d'intérêt…">${esc(p?.texte)}</textarea></label>
      <label class="field">Mon projet professionnel <textarea id="pres-projet" name="projet" rows="4" class="input" placeholder="Le métier ou le secteur visé, la poursuite d'études envisagée…">${esc(p?.projet)}</textarea></label>
      <div class="row"><button class="btn btn-primary">Enregistrer</button>${f ? `<span class="${f.ok ? "msg-ok" : "msg-err"}" role="status">${esc(f.m)}</span>` : ""}</div>
    </form>` : p ? `<p class="prose">${esc(p.texte)}</p><h3 style="font-size:15px;margin:16px 0 4px">Projet professionnel</h3><p class="prose">${esc(p.projet)}</p>`
    : `<p class="empty">L'étudiant·e n'a pas encore rédigé sa présentation.</p>`;
  return `<div class="grid-main">
    <section class="card"><h2>Présentation de l'étudiant·e ${p ? `<small>Mise à jour le ${dateC(p.maj)}</small>` : ""}</h2>${corps}</section>
    <aside class="card"><h2>Le portfolio en bref</h2><ul class="ac" style="color:var(--muted)">
      <li>Un onglet par compétence : un <strong style="color:var(--fg)">argumentaire</strong> réflexif et 1 à ${MAX_TRACES} <strong style="color:var(--fg)">traces PDF</strong> qui l'appuient.</li>
      <li>Les compétences et niveaux attendus changent selon l'année : 3 compétences en BUT1, 5 en BUT2 et BUT3.</li>
      <li>Les années précédentes restent consultables et peuvent être complétées.</li>
      <li>L'onglet « Portfolio complet » rassemble l'ensemble pour la lecture et l'évaluation.</li></ul></aside>
  </div>`;
}

function vueCompetence(u, etu, c) {
  const a = ui.annee, cle = k(etu.id, a, c.code);
  const [libNiv, acs] = c.niveaux[a];
  const modif = peutModifier(etu.id, a);
  const ens = estEns(u);
  const arg = S.args[cle];
  const traces = tracesDe(etu.id, a, c.code);
  const ev = S.evals[cle];
  const dm = derniereModif(etu.id, a, c.code);
  const fA = ui.flash.arg, fT = ui.flash.trace, fE = ui.flash.eval;
  const blocArg = modif ? `
    <form class="form" data-form="arg">
      <textarea id="arg-${cle}" name="texte" rows="11" class="input" data-compteur placeholder="Décrivez la situation, ce que vous avez fait, ce que vous en avez appris, et en quoi vos traces en témoignent…">${esc(arg?.texte)}</textarea>
      <div class="row"><button class="btn btn-primary">Enregistrer l'argumentaire</button><span class="count" data-count>${mots(arg?.texte)} mots</span>${fA ? `<span class="${fA.ok ? "msg-ok" : "msg-err"}" role="status">${esc(fA.m)}</span>` : ""}</div>
    </form>` : arg?.texte ? `<p class="prose">${esc(arg.texte)}</p><div class="count" style="margin-top:8px">${mots(arg.texte)} mots</div>` : `<p class="empty">Aucun argumentaire déposé.</p>`;
  const listeTraces = traces.map((t) => `
    <li class="trace"><div class="trace-top"><div class="pdf">PDF</div><div style="min-width:0;flex:1">
      <div class="trace-title">${esc(t.titre)}</div>${t.desc ? `<div class="sub">${esc(t.desc)}</div>` : ""}
      <div class="meta">${esc(t.fichier)} · ${taille(t.taille)} · déposée le ${dateC(t.depose)}${t.maj !== t.depose ? ` · modifiée ${rel(t.maj)}` : ""}</div></div></div>
      ${modif ? (ui.ouvert["edit-" + t.id] ? `
        <form class="form drop" data-form="edit" data-trace="${t.id}">
          <input id="et-${t.id}" name="titre" class="input" value="${esc(t.titre)}" required>
          <input id="ed-${t.id}" name="desc" class="input" value="${esc(t.desc)}" placeholder="Contexte">
          <label class="field" style="font-weight:400;font-size:13px">Remplacer le fichier (facultatif)<input id="ef-${t.id}" name="fichier" type="file" accept="application/pdf,.pdf"></label>
          <div class="row"><button class="btn btn-primary">Enregistrer</button><button type="button" class="btn" data-act="fermer" data-cle="edit-${t.id}">Annuler</button></div>
        </form>` : `<div class="row">
          <button class="btn-link" data-act="ouvrir" data-cle="edit-${t.id}">Modifier / remplacer</button>
          ${ui.ouvert["del-" + t.id] ? `<button class="btn-link btn-danger" data-act="supprimer" data-trace="${t.id}"><strong>Confirmer la suppression</strong></button><button class="btn-link" data-act="fermer" data-cle="del-${t.id}">Annuler</button>`
            : `<button class="btn-link btn-danger" data-act="ouvrir" data-cle="del-${t.id}">Supprimer</button>`}</div>`) : ""}
    </li>`).join("");
  const formTrace = modif && traces.length < MAX_TRACES ? (ui.ouvert.nouvelle ? `
    <form class="form drop" data-form="trace" style="margin-top:12px">
      <div class="two"><label class="field">Titre de la trace *<input id="nt-titre" name="titre" class="input" required placeholder="Ex. : Rapport de SAÉ diagnostic"></label>
        <label class="field">Fichier PDF * (10 Mo max.)<input id="nt-fichier" name="fichier" type="file" accept="application/pdf,.pdf" required></label></div>
      <label class="field">Contexte (facultatif)<input id="nt-desc" name="desc" class="input" placeholder="SAÉ, stage, projet associatif… et date de réalisation"></label>
      <div class="row"><button class="btn btn-primary">Déposer</button><button type="button" class="btn" data-act="fermer" data-cle="nouvelle">Annuler</button>${fT && !fT.ok ? `<span class="msg-err" role="status">${esc(fT.m)}</span>` : ""}</div>
    </form>` : `<div class="row" style="margin-top:12px"><button class="btn" data-act="ouvrir" data-cle="nouvelle">+ Déposer une trace (PDF)</button>${fT?.ok ? `<span class="msg-ok" role="status">${esc(fT.m)}</span>` : ""}</div>`) : "";
  const journal = S.journal.filter((j) => j.etu === etu.id && j.annee === a && j.comp === c.code).sort((x, y) => y.at.localeCompare(x.at));
  const aside = ens ? `
    <section class="card"><h2>Évaluation</h2>
      ${statutPublication(ev)}
      ${ev && dm > ev.maj ? `<div class="notice warn" style="margin-bottom:12px">L'étudiant·e a modifié ce dépôt après la dernière évaluation (${rel(ev.maj)}).</div>` : ""}
      <form class="form" data-form="eval">
        <fieldset class="radios" style="border:0;padding:0;margin:0"><legend style="font-weight:500;font-size:14px;margin-bottom:4px">Niveau atteint</legend>
          ${NIVEAUX_EVAL.map(([code, lib]) => `<label><input type="radio" id="ev-${code}" name="niveau" value="${code}" ${(ev?.niveau || "non_evalue") === code ? "checked" : ""}> ${lib}</label>`).join("")}</fieldset>
        <label class="field">Note sur 20 <span style="color:var(--bad)">*</span>
          <span class="row" style="gap:8px"><input class="input" id="ev-note" name="note" inputmode="decimal" style="width:96px" value="${ev?.note !== null && ev?.note !== undefined ? String(ev.note).replace(".", ",") : ""}" placeholder="ex. 13,5"><span class="sub" style="white-space:nowrap">/ 20</span></span>
          <span class="sub" style="font-size:12px;font-weight:400">Obligatoire dès qu'un niveau est choisi : la note accompagne le niveau qualitatif.</span></label>
        <label class="field">Commentaire<textarea id="ev-com" name="com" rows="5" class="input" placeholder="Points forts, axes de progrès, éléments attendus…">${esc(ev?.com)}</textarea></label>
        <div class="row"><button class="btn" value="brouillon">Enregistrer le brouillon</button><button class="btn btn-primary" value="publier">Enregistrer et publier</button></div>
        ${fE ? `<span class="${fE.ok ? "msg-ok" : "msg-err"}" role="status">${esc(fE.m)}</span>` : ""}
      </form></section>` : ev?.pub ? `<section class="card"><h2>Retour de l'enseignant·e <small>Publiée le ${dateC(ev.pub.at)}</small></h2>${pill(ev.pub.niveau, ev.pub.note)}${ev.pub.com ? `<p class="prose" style="margin-top:10px">${esc(ev.pub.com)}</p>` : ""}</section>` : "";
  return `<div class="grid-main">
    <div class="stack">
      <div class="comp-head" style="background:var(--${c.code.toLowerCase()}-soft)">
        <div class="eyebrow" style="color:${cvar(c.code)}">${c.code} · ${c.tronc ? "Tronc commun" : `Parcours ${parcoursDe(etu.parcours)}`} · BUT${a}</div>
        <h2>${esc(c.intitule)}</h2><div>Niveau ${niveauNum(c, a)} — <strong>${esc(libNiv)}</strong></div>
      </div>
      <section class="card"><h2>Argumentaire ${arg ? `<small>Modifié ${rel(arg.maj)}</small>` : ""}</h2>${blocArg}</section>
      <section class="card"><h2>Traces <small>${traces.length} / ${MAX_TRACES}</small></h2>
        ${traces.length ? `<ul class="plain">${listeTraces}</ul>` : `<p class="empty">Aucune trace déposée.</p>`}${formTrace}</section>
    </div>
    <aside class="stack">
      ${aside}
      <section class="card"><h2>Apprentissages critiques visés</h2><ul class="plain" style="gap:7px;font-size:14px">${acs.map((x, i) => `<li style="display:flex;gap:8px"><span style="font:600 12px var(--font-data);color:var(--accent);white-space:nowrap;line-height:21px">${codeAC(c, a, i)}</span><span>${esc(x)}</span></li>`).join("")}</ul></section>
      ${ens ? `<section class="card"><h2>Historique de ce dépôt</h2>${feed(journal, { sansComp: true })}</section>`
        : `<section class="card guide"><h2>Structurer son argumentaire</h2><ol>${GUIDE.map(([e, q]) => `<li><strong>${e}</strong><span>${q}</span></li>`).join("")}</ol></section>`}
    </aside>
  </div>`;
}

// Synthèse des notes d'une année ; publie = ce que voit l'étudiant, sinon brouillons du référent.
function synthese(etu, a, publie) {
  const noteRdv = (n) => { const r = rdvDe(etu.id, a, n); return publie ? (r?.pub?.note ?? null) : (r?.note ?? null); };
  const r1 = noteRdv(1), r2 = noteRdv(2);
  const cel = (n) => (n === null || n === undefined ? `<span class="sub">—</span>` : fmtNote(n));
  return `<div class="card" style="padding:0;overflow:hidden"><div class="table-wrap"><table class="promo"><thead><tr>
      <th>Compétence</th><th>Niveau</th><th>Compétence (${pct(POIDS_COMP)})</th><th>RDV 1 (${pct(RDV[0].poids)})</th><th>RDV 2 (${pct(RDV[1].poids)})</th><th>Note finale</th></tr></thead><tbody>
    ${compsAnnee(a, etu.parcours).map((c) => {
      const ev = S.evals[k(etu.id, a, c.code)];
      const niveau = (publie ? ev?.pub?.niveau : ev?.niveau) || "non_evalue";
      const note = publie ? (ev?.pub?.note ?? null) : (ev?.note ?? null);
      const fin = noteFinale(note, r1, r2);
      return `<tr><td><span class="dot" style="background:${cvar(c.code)};margin-right:6px"></span><strong>${c.code}</strong> ${c.court}</td><td style="text-align:center">${pill(niveau)}</td>

function lireTableau(tableau) {
  const iEntete = tableau.findIndex((l) => (l || []).some((c) => ENTETES[norm(c)]));
  if (iEntete < 0) return { erreur: "Ligne d'en-tête introuvable : la première ligne doit contenir Nom, Prénom, Email étudiant, Année…" };
  const cols = tableau[iEntete].map((c) => ENTETES[norm(c)]);
  const manque = ["nom", "prenom", "annee"].filter((c) => !cols.includes(c));
  if (manque.length) return { erreur: `Colonne(s) obligatoire(s) manquante(s) : ${manque.join(", ")}.` };
  const lignes = [];
  for (let i = iEntete + 1; i < tableau.length; i++) {
    const cel = tableau[i] || [];
    if (cel.every((c) => !String(c ?? "").trim())) continue;
    const l = { numero: i + 1 };
    cols.forEach((ch, j) => { const v = String(cel[j] ?? "").trim(); if (ch && v) l[ch] = v; });
    lignes.push(l);
  }
  return lignes.length ? { lignes } : { erreur: "Le fichier ne contient aucun étudiant sous la ligne d'en-tête." };
}
function decouperNom(t) {

  return { prenom: m[0], nom: m.slice(1).join(" ") || m[0] };
}

    else if (parcours !== "GEMA") avert.push(`Seul le référentiel GEMA est configuré : onglets GEMA affichés pour ${parcours}.`);
    const cle = cleNom(prenom, nom);
    if (vus.has(cle)) erreurs.push(`Doublon de la ligne ${vus.get(cle)}.`); else vus.set(cle, l.numero);
    const emailValide = EMAIL_OK.test(email);
    if (!email) avert.push("Email étudiant absent : pas de notification par courriel.");
    else if (!emailValide) erreurs.push(`Email étudiant « ${l.email} » invalide.`);
    else if (mailsVus.has(email)) erreurs.push(`Email déjà utilisé ligne ${mailsVus.get(email)}.`); else mailsVus.set(email, l.numero);
    if (emailRef && !EMAIL_OK.test(emailRef)) erreurs.push(`Email enseignant « ${l.emailRef} » invalide.`);
    // Référent : l'email est prioritaire sur le nom.
    let referentId = null, referentNom = "", aCreerRef = null, completerMailRef = null;
    const refTexte = l.referent || "", refIndique = !!(refTexte || emailRef);
    if (refIndique) {
      let trouve = EMAIL_OK.test(emailRef) ? ens.find((e) => norm(e.email) === norm(emailRef)) : null;
      if (!trouve && refTexte) {
        const t = norm(refTexte), exact = ens.filter((e) => t === cleNom(e.prenom, e.nom) || t === cleNom(e.nom, e.prenom));
        const parNom = ens.filter((e) => norm(e.nom) === t);
        trouve = exact.length === 1 ? exact[0] : exact.length > 1 || parNom.length > 1 ? "ambigu" : parNom[0] || null;
      }
      if (trouve === "ambigu") erreurs.push(`Référent « ${refTexte} » ambigu : indiquez son email.`);
      else if (trouve) {
        referentId = trouve.id; referentNom = trouve.prenom + " " + trouve.nom;
        if (emailRef && norm(trouve.email || "") !== norm(emailRef)) {
          if (!trouve.email) completerMailRef = emailRef; else avert.push(`Email enseignant différent de celui enregistré (${trouve.email}) : conservé.`);
        }
      } else if (!refTexte) erreurs.push(`Aucun enseignant avec l'email ${emailRef} : indiquez aussi son nom.`);
      else if (creerEns) {
        const c = emailRef || norm(refTexte);
        aCreerRef = aCreer.get(c) || { ...decouperNom(refTexte), email: emailRef };
        aCreer.set(c, aCreerRef); referentNom = aCreerRef.prenom + " " + aCreerRef.nom;
        avert.push(`Enseignant « ${referentNom} » inconnu : il sera créé${emailRef ? "" : " sans email"}.`);
      } else erreurs.push(`Référent « ${refTexte} » inconnu : ajoutez-le ou cochez « créer les enseignants inconnus ».`);
    }
    // Étudiant existant : par email (si le nom correspond), sinon par nom.
    let parEmail = emailValide ? etus.find((e) => norm(e.email || "") === email) : null;
    if (parEmail && cleNom(parEmail.prenom, parEmail.nom) !== cle) { erreurs.push(`L'adresse ${email} appartient à ${parEmail.prenom} ${parEmail.nom}.`); parEmail = null; }
    const homonymes = etus.filter((e) => cleNom(e.prenom, e.nom) === cle);
    const existant = parEmail || (homonymes.length === 1 ? homonymes[0] : null);
    if (!parEmail && homonymes.length > 1) erreurs.push("Plusieurs étudiants portent ce nom : renseignez l'email étudiant.");
    if (emailValide && !erreurs.some((e) => e.startsWith(`L'adresse ${email}`)) && USERS.some((u) => norm(u.email || "") === email && u.id !== existant?.id)) erreurs.push(`L'adresse ${email} appartient déjà à un autre compte.`);
    const changements = [];
    let action = "creer", nouvelEmail = null;
    if (existant) {
      if (annee && existant.annee !== annee) changements.push(`BUT${existant.annee} → BUT${annee}`);
      if ((existant.parcours || "GEMA") !== parcours) changements.push(`parcours → ${parcours}`);
      if (refIndique && (aCreerRef || referentDe(existant.id) !== referentId)) changements.push(`référent → ${referentNom}`);
      if (emailValide && norm(existant.email || "") !== email) { nouvelEmail = email; changements.push(existant.email ? `email → ${email}` : "email ajouté"); }
      if (completerMailRef) changements.push("email du référent ajouté");
      if (!estActif(existant)) changements.push("compte désactivé réactivé");
      action = changements.length ? "maj" : "inchange";
    } else {
      nouvelEmail = emailValide ? email : null;
      if (!refIndique) avert.push("Aucun référent : visible uniquement par l'administrateur.");
    }
    if (erreurs.length) action = "erreur";
    return { numero: l.numero, nom, prenom, annee, parcours, email, emailRef, groupe: l.groupe || "", refTexte, referentId, referentNom, aCreerRef, completerMailRef, etudiantId: existant?.id || null, nouvelEmail, action, changements, erreurs, avert };

}
function appliquerImport(apercu) {
  const crees = new Map(), bilan = { crees: 0, maj: 0, inchanges: 0, ignores: 0, ens: 0 };
  for (const l of apercu) {
    if (l.action === "erreur") { bilan.ignores++; continue; }
    if (l.action === "inchange") { bilan.inchanges++; continue; }
    let refId = l.referentId;
    if (l.aCreerRef) {
      const c = l.aCreerRef.email || norm(l.aCreerRef.prenom + " " + l.aCreerRef.nom);
      refId = crees.get(c);
      if (!refId) { refId = "ens-" + seq++; USERS.push({ id: refId, role: "enseignant", prenom: l.aCreerRef.prenom, nom: l.aCreerRef.nom, email: l.aCreerRef.email }); crees.set(c, refId); bilan.ens++; }
    }
    if (refId && l.completerMailRef) user(refId).email = l.completerMailRef;
    if (l.action === "creer") {
      const id = "etu-" + seq++;
      USERS.push({ id, role: "etudiant", nom: l.nom, prenom: l.prenom, email: l.nouvelEmail || "", annee: l.annee, parcours: l.parcours, groupe: l.groupe });
      if (refId) S.referents[id] = refId;
      bilan.crees++;
    } else {
      const e = user(l.etudiantId);
      e.annee = l.annee; e.parcours = l.parcours; e.actif = true;
      if (l.nouvelEmail) e.email = l.nouvelEmail;
      if (l.refTexte || l.emailRef) { if (refId) S.referents[e.id] = refId; else delete S.referents[e.id]; }
      bilan.maj++;
    }
  }
  return bilan;
}
async function lireFichierImport(fichier) {
  if (/\.csv$/i.test(fichier.name)) {
    const texte = (await fichier.text()).replace(/^﻿/, "");
    const sep = (texte.split("\n")[0].match(/;/g) || []).length >= (texte.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
    return lireTableau(texte.split(/\r?\n/).map((l) => l.split(sep).map((c) => c.trim().replace(/^"(.*)"$/, "$1"))));
  }
  if (!/\.xlsx?$/i.test(fichier.name)) return { erreur: "Format non pris en charge : utilisez un fichier .xlsx (Excel) ou .csv." };
  if (!window.XLSX) return { erreur: "La lecture des fichiers Excel n'a pas pu être chargée : réessayez, ou enregistrez la liste en .csv." };
  try {
    const classeur = XLSX.read(await fichier.arrayBuffer(), { type: "array" });
    const feuille = classeur.Sheets[classeur.SheetNames[0]];
    return lireTableau(XLSX.utils.sheet_to_json(feuille, { header: 1, raw: false, defval: "" }));
  } catch (e) { return { erreur: "Le fichier Excel est illisible. Enregistrez-le au format .xlsx puis réessayez." }; }
}

// Publie les brouillons (évaluations notées, et rendez-vous si toute l'année) ; une évaluation sans note n'est pas publiable.
function publier(etu, annee, comp, numeroRdv) {
  const elements = [];
  let premierLien = null;
  if (!numeroRdv) compsAnnee(annee, user(etu)?.parcours).filter((c) => !comp || c.code === comp).forEach((c) => {
    const ev = S.evals[k(etu, annee, c.code)];
    if (nonPublie(ev) && ev.note !== null && ev.note !== undefined) {
      ev.pub = { niveau: ev.niveau, note: ev.note, com: ev.com, at: now() };
      elements.push(`${c.code} : ${libEval(ev.niveau)} (${fmtNote(ev.note)})`); premierLien = premierLien || { onglet: c.code, titre: `Évaluation publiée : ${c.code} ${c.court} (BUT${annee})` };
      log(etu, annee, c.code, "evaluation_publiee", `${libEval(ev.niveau)} · ${fmtNote(ev.note)}`);
    }
  });
  if (!comp) RDV.filter((d) => !numeroRdv || d.n === numeroRdv).forEach((d) => {
    const r = rdvDe(etu, annee, d.n);
    if (rdvNonPublie(r)) {
      r.pub = { note: r.note, com: r.com, at: now() };
      elements.push(`RDV ${d.n} : ${fmtNote(r.note)}`); premierLien = premierLien || { onglet: "suivi", titre: `${d.libelle} : note publiée (BUT${annee})` };
      log(etu, annee, null, "rendez_vous_publie", `${d.libelle} · ${fmtNote(r.note)}`);
    }
  });
  const n = elements.length;
  if (n) {
    // Notification de l'étudiant (dans l'outil, et courriel selon sa préférence).
    const auteur = user(ui.user);
    notifierAvecCourriel({
      dest: etu,
      titre: n > 1 ? `${n} notes publiées (BUT${annee})` : premierLien.titre,
      detail: `${elements.join(" · ")} · par ${auteur.prenom} ${auteur.nom}`,
      annee, onglet: n > 1 ? "suivi" : premierLien.onglet,
    });
  }
  return n;
}

    save(); render();
  }
});

async function lirePdf(input) {
  const f = input?.files?.[0];
  if (!f) return "Choisissez un fichier PDF.";
  if (f.size > 10 * 1024 * 1024) return "Le fichier dépasse 10 Mo.";
  const debut = await f.slice(0, 5).text();
  if (debut !== "%PDF-") return "Le fichier doit être un PDF.";
  return f;
}

  s.textContent = message;
}

document.addEventListener("submit", async (e) => {

    const c = user(ui.ficheId), email = fd.get("email").trim().toLowerCase();

    if (c.id === ui.user && fd.get("admin") !== "1" && c.role === "admin") { ui.flash = { fiche: { cle: "infos", ok: false, m: "Vous ne pouvez pas retirer vos propres droits d'administrateur." } }; render(); return; }
    c.nom = fd.get("nom").trim(); c.prenom = fd.get("prenom").trim(); c.email = email;
    if (c.role === "etudiant") {
      const avant = c.annee;
      c.annee = +fd.get("annee"); c.parcours = fd.get("parcours"); c.groupe = fd.get("groupe").trim();
      if (fd.get("referent")) S.referents[c.id] = fd.get("referent"); else delete S.referents[c.id];

    } else c.role = fd.get("admin") === "1" ? "admin" : "enseignant";
    ui.flash = { fiche: { cle: "infos", ok: true, m: "Compte enregistré." } };
    save(); render(); return;
  }
  if (kind === "supprimer") {
    const c = user(ui.ficheId);
    if (!c || c.id === ui.user) return;
    if (norm(fd.get("confirmation")) !== norm(c.nom)) { ui.flash = { fiche: { cle: "suppr", ok: false, m: `Pour confirmer, saisissez le nom « ${c.nom} ».` } }; render(); return; }
    const h = historique(c.id);
    if (c.role !== "etudiant" && (h.evalsDonnees || h.actions)) { ui.flash = { fiche: { cle: "suppr", ok: false, m: `Suppression impossible : ${h.evalsDonnees} évaluation(s) et ${h.actions} action(s) dans l'historique. Désactivez plutôt ce compte.` } }; render(); return; }
    if (c.role === "etudiant") {
      for (const cle of Object.keys(S.args)) if (cle.startsWith(c.id + "|")) delete S.args[cle];
      for (const cle of Object.keys(S.evals)) if (cle.startsWith(c.id + "|")) delete S.evals[cle];
      S.traces = S.traces.filter((t) => t.etu !== c.id); S.journal = S.journal.filter((j) => j.etu !== c.id);
      S.notifs = S.notifs.filter((n) => n.dest !== c.id && n.etu !== c.id); delete S.pres[c.id]; delete S.referents[c.id];
    } else for (const [etu, ref] of Object.entries(S.referents)) if (ref === c.id) delete S.referents[etu];
    USERS.splice(USERS.indexOf(c), 1);
    ui.vue = "affectations"; ui.flash = {};
    save(); render(); return;

  if (kind === "passage") {

    } else {
      const annee = fd.get("annee"), parcours = fd.get("parcours"), referent = fd.get("referent"), groupe = fd.get("groupe").trim();
      if (!annee && !parcours && !referent && !groupe) { ui.flash = { passage: { ok: false, m: "Choisissez au moins une modification à appliquer." } }; render(); return; }
      let n = 0; const ignores = [];
      for (const id of ids) {
        const x = user(id), avant = x.annee;
        if (annee === "suivante" && x.annee >= 3) { ignores.push(`${x.prenom} ${x.nom} (déjà en BUT3)`); continue; }
        if (annee === "suivante") x.annee++; else if (annee) x.annee = +annee;
        if (parcours) x.parcours = parcours;
        if (referent === "__aucun") delete S.referents[id]; else if (referent) S.referents[id] = referent;
        if (groupe) x.groupe = groupe;
        const morceaux = [avant !== x.annee && `BUT${avant} → BUT${x.annee}`, parcours && `parcours ${parcours}`, referent && `référent ${referent === "__aucun" ? "retiré" : nom(referent)}`, groupe && `groupe ${groupe}`].filter(Boolean);
        S.journal.push({ id: seq++, etu: id, acteur: ui.user, annee: null, comp: null, type: avant !== x.annee ? "passage_annee" : "compte_modifie", detail: morceaux.join(" · "), at: now() });
        n++;
      }
      ui.flash = { passage: { ok: true, m: `${n} étudiant(s) mis à jour.${ignores.length ? ` Ignorés : ${ignores.join(", ")}.` : ""}` } };
    }
    p.sel = []; save(); render(); return;
  }
  if (kind === "ajout-etu" || kind === "ajout-ens") {
    if (user(ui.user).role !== "admin") return;
    const cible = kind === "ajout-etu" ? "etu" : "ens";
    const nom = fd.get("nom").trim(), prenom = fd.get("prenom").trim(), email = fd.get("email").trim().toLowerCase();
    let erreur = !nom || !prenom ? "Le nom et le prénom sont obligatoires." : email && !EMAIL_OK.test(email) ? "Adresse mail invalide." : email && USERS.some((u) => norm(u.email || "") === email) ? `L'adresse ${email} est déjà utilisée.` : "";
    if (!erreur && cible === "etu" && !fd.get("annee")) erreur = "Choisissez l'année de BUT.";
    if (erreur) { ui.flash = { ajout: { cible, ok: false, m: erreur } }; render(); return; }
    if (cible === "etu") {
      const id = "etu-" + seq++;
      USERS.push({ id, role: "etudiant", nom, prenom, email, annee: +fd.get("annee"), parcours: fd.get("parcours"), groupe: fd.get("groupe").trim() });
      if (fd.get("referent")) S.referents[id] = fd.get("referent");
      ui.flash = { ajout: { cible, ok: true, m: `${prenom} ${nom} ajouté·e en BUT${fd.get("annee")}.` } };
    } else {
      const admin = fd.get("admin") === "1";
      USERS.push({ id: "ens-" + seq++, role: admin ? "admin" : "enseignant", nom, prenom, email });
      ui.flash = { ajout: { cible, ok: true, m: `${prenom} ${nom} ajouté·e${admin ? " comme administrateur" : ""}.` } };
    }
    save(); render(); return;
  }
  const etu = ui.etu, a = ui.annee, c = ui.onglet, cle = k(etu, a, c);
  if (kind === "pres") {
    if (!peutModifier(etu)) return;
    S.pres[etu] = { texte: fd.get("texte").trim(), projet: fd.get("projet").trim(), maj: now() };
    log(etu, null, null, "presentation_maj", ""); prevenirReferent(etu, null, null, "présentation et projet professionnel"); ui.flash = { pres: { ok: true, m: "Présentation enregistrée." } };
  } else if (kind === "arg") {
    if (!peutModifier(etu, a)) return;
    const t = fd.get("texte").trim(), avant = S.args[cle];
    if ((avant?.texte || "") === t) { ui.flash = { arg: { ok: true, m: "Aucune modification." } }; render(); return; }
    const ecart = mots(t) - mots(avant?.texte);
    S.args[cle] = { texte: t, maj: now() };
    log(etu, a, c, avant ? "argumentaire_maj" : "argumentaire_cree", `${mots(t)} mots${avant ? ` (${ecart >= 0 ? "+" : ""}${ecart})` : ""}`);
    prevenirReferent(etu, a, c, `argumentaire ${avant ? "modifié" : "rédigé"} (${mots(t)} mots)`);
    ui.flash = { arg: { ok: true, m: "Argumentaire enregistré." } };
  } else if (kind === "trace") {
    if (!peutModifier(etu, a)) return;
    const titre = fd.get("titre").trim();
    const f = await lirePdf(form.querySelector("input[type=file]"));
    if (typeof f === "string" || !titre) { ui.flash = { trace: { ok: false, m: !titre ? "Donnez un titre à la trace." : f } }; render(); return; }
    if (tracesDe(etu, a, c).length >= MAX_TRACES) return;
    S.traces.push({ id: "t" + seq++, etu, annee: a, comp: c, titre, desc: fd.get("desc").trim(), fichier: f.name, taille: f.size, depose: now(), maj: now() });
    log(etu, a, c, "trace_ajoutee", titre); prevenirReferent(etu, a, c, `trace déposée : ${titre}`); delete ui.ouvert.nouvelle;
    ui.flash = { trace: { ok: true, m: "Trace déposée." } };
  } else if (kind === "edit") {
    const t = S.traces.find((x) => x.id === form.dataset.trace);
    if (!t || !peutModifier(t.etu, t.annee)) return;
    const input = form.querySelector("input[type=file]");
    let f = null;
    if (input.files.length) { f = await lirePdf(input); if (typeof f === "string") { ui.flash = { trace: { ok: false, m: f } }; delete ui.ouvert["edit-" + t.id]; render(); return; } }
    t.titre = fd.get("titre").trim() || t.titre; t.desc = fd.get("desc").trim(); t.maj = now();
    if (f) { t.fichier = f.name; t.taille = f.size; }
    log(t.etu, t.annee, t.comp, "trace_modifiee", f ? `${t.titre} — nouveau fichier : ${f.name}` : t.titre);
    prevenirReferent(t.etu, t.annee, t.comp, f ? `fichier de trace remplacé : ${t.titre}` : `trace modifiée : ${t.titre}`);
    delete ui.ouvert["edit-" + t.id]; ui.flash = { trace: { ok: true, m: f ? "Fichier remplacé." : "Trace modifiée." } };
  } else if (kind === "eval") {
    if (!suit(user(ui.user), etu)) return;
    const niveau = fd.get("niveau") || "non_evalue";
    const publierAussi = e.submitter?.value === "publier";
    const note = lireNote(fd.get("note"));
    // Erreurs affichées sans redessiner : la saisie est conservée.
    if (publierAussi && niveau === "non_evalue") return erreurFormulaire(form, "Choisissez un niveau avant de publier.");
    if (note === undefined) return erreurFormulaire(form, "La note doit être comprise entre 0 et 20.");
    if (niveau !== "non_evalue" && note === null) return erreurFormulaire(form, "Saisissez la note sur 20 : elle accompagne obligatoirement le niveau.");
    const noteRetenue = niveau === "non_evalue" ? null : note;
    S.evals[cle] = { ...(S.evals[cle] || { pub: null }), niveau, note: noteRetenue, com: fd.get("com").trim(), ens: ui.user, maj: now() };
    log(etu, a, c, "evaluation", `${libEval(niveau)}${noteRetenue !== null ? ` · ${fmtNote(noteRetenue)}` : ""} (brouillon)`);
    if (publierAussi) publier(etu, a, c);
    ui.flash = { eval: { ok: true, m: publierAussi ? "Évaluation publiée : l'étudiant·e peut la consulter." : "Brouillon enregistré, non visible par l'étudiant·e." } };
  } else if (kind === "rdv") {
    if (!suit(user(ui.user), etu)) return;
    const n = +form.dataset.numero, note = lireNote(fd.get("note"));
    if (note === undefined) return erreurFormulaire(form, "La note doit être comprise entre 0 et 20.");
    if (note === null) return erreurFormulaire(form, "Saisissez la note du rendez-vous sur 20.");
    const avant = rdvDe(etu, a, n);
    S.rdv[`${etu}|${a}|${n}`] = { ...(avant || { pub: null }), date: fd.get("date") || "", note, com: fd.get("com").trim(), ens: ui.user, maj: now() };
    log(etu, a, null, "rendez_vous", `${RDV[n - 1].libelle} · ${fmtNote(note)} (brouillon)`);
    const publierAussi = e.submitter?.value === "publier";
    if (publierAussi) publier(etu, a, null, n);
    ui.flash = { rdv: { n, ok: true, m: publierAussi ? "Rendez-vous publié : l'étudiant·e voit la note." : "Brouillon enregistré, non visible par l'étudiant·e." } };
  }
  save(); render();
});

render();
</script>
